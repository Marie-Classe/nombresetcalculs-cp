:root{--bg:#fcf4f5;--panel:#fff;--fg:#2a2024;--muted:#7a6264;--line:#efd6d9;--blue:#b8434c;--blue-l:#fae6e8;--ok:#1f8a4c;--ko:#7a1f1f;--ans:#b8434c;--c:#b8434c}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1d1415;--panel:#281b1d;--fg:#f3e8e8;--muted:#c4a9aa;--line:#4a3032;--blue:#e68a84;--blue-l:#3b2326;--ok:#4cc58a;--ko:#ff9a9a;--ans:#f0a09b;--c:#e68a84}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:'AccesScript',system-ui,sans-serif;font-size:20px}
button{font:inherit;color:inherit;cursor:pointer;-webkit-appearance:none;appearance:none;-webkit-tap-highlight-color:transparent;outline-offset:2px}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:12px 16px}
h1{font-size:24px;margin:0;color:var(--blue)} .sub{font-size:16px;color:var(--muted)}
.seg{display:inline-flex;border:2px solid var(--blue);border-radius:14px;overflow:hidden}
.seg button{border:0;background:var(--panel);padding:8px 16px}.seg button[aria-pressed=true]{background:var(--blue);color:#fff}
.btn{border:2px solid var(--blue);background:var(--blue);color:#fff;border-radius:12px;padding:8px 14px}
.btn.ghost{background:var(--panel);color:var(--blue)} .btn.small{padding:4px 10px;font-size:18px}
.app{display:grid;grid-template-columns:300px 1fr;gap:14px;padding:0 16px 24px;align-items:start}
.chs{display:flex;flex-direction:column;gap:5px;max-height:calc(100vh - 90px);overflow:auto;position:sticky;top:8px}
